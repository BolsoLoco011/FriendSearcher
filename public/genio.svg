  <ellipse cx="320" cy="228" rx="18" ry="26" fill="#ffffff" stroke="#000000" stroke-width="4.5" />
  <!-- Iris and Pupil -->
  <circle cx="316" cy="228" r="11" fill="#0088ff" stroke="#0055bb" stroke-width="2" />
  <circle cx="314" cy="227" r="5" fill="#001f3f" />
  <circle cx="311" cy="222" r="2.5" fill="#ffffff" />
  <!-- Eyebrow -->
  <path d="M 300 198 Q 322 192 344 200" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />

  <!-- Screaming Mouth - Upper Jaw & Teeth -->
  <path d="M 308 316 L 435 300 L 437 334 L 318 348 Z" fill="#ffffff" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />
  <!-- Upper Teeth Separators -->
  <line x1="330" y1="314" x2="332" y2="346" stroke="#000000" stroke-width="3.5" />
  <line x1="350" y1="312" x2="352" y2="344" stroke="#000000" stroke-width="3.5" />
  <line x1="372" y1="309" x2="374" y2="340" stroke="#000000" stroke-width="3.5" />
  <line x1="394" y1="306" x2="395" y2="338" stroke="#000000" stroke-width="3.5" />
  <line x1="414" y1="303" x2="415" y2="336" stroke="#000000" stroke-width="3.5" />

  <!-- Screaming Mouth - Interior Dark Void -->
  <path d="M 318 348 L 437 334 C 445 378 415 422 355 450 L 342 428 C 382 405 405 378 398 356 L 318 348 Z" fill="#000000" />

  <!-- Screaming Mouth - Lower Jaw & Lower Teeth -->
  <path d="M 437 334 C 452 400 412 450 345 464 L 348 444 L 400 426 C 414 394 412 366 410 354 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  <!-- Lower Teeth Separators -->
  <line x1="360" y1="458" x2="372" y2="438" stroke="#000000" stroke-width="3.5" />
  <line x1="380" y1="451" x2="391" y2="432" stroke="#000000" stroke-width="3.5" />
  <line x1="400" y1="442" x2="410" y2="424" stroke="#000000" stroke-width="3.5" />

  <!-- Chin and Throat Lines -->
  <path d="M 345 464 C 342 472 336 480 342 490 L 358 500" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
  <path d="M 480 262 L 466 355 L 468 368" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />

  <!-- Stubble / Beard Hatching -->
  <g stroke="#000000" stroke-width="2.8" stroke-linecap="round" opacity="0.9">
    <!-- Cheek -->
    <line x1="325" y1="278" x2="330" y2="281" />
    <line x1="337" y1="272" x2="342" y2="276" />
    <line x1="350" y1="268" x2="356" y2="272" />
    <line x1="363" y1="270" x2="369" y2="274" />
    <line x1="375" y1="266" x2="381" y2="270" />
    <line x1="390" y1="271" x2="397" y2="276" />
    <line x1="404" y1="268" x2="410" y2="272" />
    <line x1="418" y1="274" x2="424" y2="278" />

    <line x1="331" y1="290" x2="337" y2="294" />
    <line x1="346" y1="285" x2="352" y2="290" />
    <line x1="364" y1="284" x2="370" y2="288" />
    <line x1="384" y1="284" x2="391" y2="289" />
    <line x1="400" y1="286" x2="407" y2="291" />
    <line x1="415" y1="288" x2="422" y2="293" />

    <!-- Jaw & Neck -->
    <line x1="360" y1="475" x2="368" y2="468" />
    <line x1="375" y1="470" x2="384" y2="461" />
    <line x1="391" y1="461" x2="400" y2="452" />
    <line x1="406" y1="452" x2="416" y2="443" />
    <line x1="421" y1="441" x2="430" y2="432" />
    <line x1="435" y1="425" x2="444" y2="416" />
    <line x1="444" y1="410" x2="452" y2="401" />

    <line x1="372" y1="486" x2="382" y2="477" />
    <line x1="390" y1="479" x2="401" y2="470" />
    <line x1="407" y1="470" x2="418" y2="461" />
    <line x1="424" y1="459" x2="435" y2="450" />
    <line x1="441" y1="446" x2="451" y2="437" />
  </g>

  <!-- Pointing Line from Shouting Face to "GENIO!" -->
  <line x1="278" y1="368" x2="195" y2="416" stroke="#000000" stroke-width="5.5" stroke-linecap="round" />

  <!-- GENIO! Typography -->
  <text x="45" y="450" font-family="Arial, 'Helvetica Neue', Impact, sans-serif" font-size="62" font-weight="900" fill="#000000" letter-spacing="-1">GENIO!</text>
</svg>
