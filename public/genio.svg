<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" style="background-color: #ffffff;">
  <!-- White Background -->
  <rect width="600" height="500" fill="#ffffff" />

  <!-- Subtle left vertical border line from screenshot -->
  <line x1="28" y1="40" x2="28" y2="350" stroke="#888888" stroke-width="1.8" opacity="0.4" />

  <!-- Blonde Hair -->
  <path d="M 270 148 
           C 265 140, 275 130, 285 138 
           C 292 130, 305 125, 315 132 
           C 325 122, 345 115, 370 108 
           C 415 92, 490 68, 550 78 
           C 580 82, 595 90, 600 95 
           L 600 175 
           C 590 170, 560 165, 520 172 
           C 480 180, 445 200, 420 228 
           C 395 255, 370 270, 335 276 
           L 310 278 
           C 318 265, 322 255, 320 242 
           C 315 230, 298 234, 292 220 
           C 285 210, 300 200, 292 188 
           C 285 180, 275 182, 270 172 
           C 266 162, 274 156, 270 148 Z" 
        fill="#ffdf00" stroke="#000000" stroke-width="3" stroke-linejoin="round" />

  <!-- Hair texture and sideburn tufts -->
  <path d="M 280 155 L 268 163 L 282 168 L 272 176 L 285 180" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

  <!-- Forehead and Nose -->
  <path d="M 315 175 
