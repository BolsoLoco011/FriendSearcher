<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="chalk-texture-crown" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="500" height="500" fill="#000000" />

  <g filter="url(#chalk-texture-crown)" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main crown points -->
    <path 
      d="M 122 280 
         L 142 92 
         L 194 220 
         L 288 126 
         L 326 264 
         L 426 238 
         L 374 362" 
      stroke-width="11" 
    />
    <path 
      d="M 126 278 
         L 140 96 
         L 196 218 
         L 286 130 
         L 324 262 
         L 422 242 
         L 372 360" 
      stroke-width="5" 
      stroke-opacity="0.85" 
    />

    <!-- Chalk lines on spikes -->
    <path d="M 130 260 L 144 100" stroke-width="4" stroke-opacity="0.9" />
    <path d="M 148 108 L 188 210" stroke-width="5" stroke-opacity="0.8" />
    <path d="M 202 212 L 284 134" stroke-width="5" stroke-opacity="0.85" />
    <path d="M 284 140 L 320 252" stroke-width="6" stroke-opacity="0.9" />
    <path d="M 334 256 L 420 240" stroke-width="5" stroke-opacity="0.85" />
    <path d="M 424 246 L 376 354" stroke-width="6" stroke-opacity="0.8" />

    <!-- Base Ellipse opening -->
    <path 
      d="M 120 282 
         C 140 330, 240 375, 340 326 
         C 365 314, 380 292, 360 274
         C 330 250, 220 220, 150 254
         C 130 264, 115 272, 120 282 Z" 
      stroke-width="9" 
    />
    <path 
      d="M 124 286 
         C 146 332, 244 372, 338 324 
         C 360 312, 376 294, 356 276
         C 326 254, 224 224, 154 256
         C 134 266, 120 274, 124 286 Z" 
      stroke-width="4" 
      stroke-opacity="0.8" 
    />

    <!-- Bottom rim -->
    <path 
      d="M 116 286 
         C 140 360, 230 422, 330 380 
         C 356 370, 382 352, 378 340" 
      stroke-width="12" 
    />
    <path 
      d="M 120 292 
         C 144 366, 232 418, 332 376 
         C 354 366, 376 350, 374 344" 
      stroke-width="5" 
      stroke-opacity="0.85" 
    />

    <!-- Chalk hatching -->
    <line x1="286" y1="210" x2="290" y2="280" stroke-width="4.5" stroke-opacity="0.75" />
    <line x1="298" y1="218" x2="304" y2="284" stroke-width="4" stroke-opacity="0.65" />
    <line x1="210" y1="250" x2="218" y2="300" stroke-width="4" stroke-opacity="0.7" />
    <circle cx="140" cy="84" r="3" fill="#ffffff" stroke="none" />
    <circle cx="292" cy="116" r="3.5" fill="#ffffff" stroke="none" />
    <circle cx="432" cy="232" r="3" fill="#ffffff" stroke="none" />
  </g>
</svg>
